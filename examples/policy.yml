orgs:
  - name: payments
    allow:
      - hostname: api.payment-provider.example.com
        protocol: tcp
        ports: [443]
    spaces:
      - name: dev
        allow:
          - hostname: sandbox.payment-provider.example.com
            protocol: tcp
            ports: [443, 8443]

  - name: reporting
    allow:
      - hostname: exports.analytics-provider.example.com
        protocol: tcp
        ports: [443]
