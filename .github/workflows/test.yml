name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Verify generated Counterfeiter fakes
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain -- asgsyncfakes)" ]; then
            git status --short -- asgsyncfakes
            exit 1
          fi

      - name: Vet and build
        run: |
          go vet ./...
          go build ./...

      - name: Run Ginkgo specs
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -r -p --randomize-all --randomize-suites \
            --fail-on-pending --fail-on-empty --keep-going --cover --coverprofile=cover.profile \
            --race --trace --json-report=report.json --output-dir="$RUNNER_TEMP/ginkgo-report" \
            --timeout=5m --poll-progress-after=30s --poll-progress-interval=15s \
            --github-output --no-color --force-newlines

      - name: Upload Ginkgo report and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ginkgo-report
          path: ${{ runner.temp }}/ginkgo-report/
          if-no-files-found: ignore
