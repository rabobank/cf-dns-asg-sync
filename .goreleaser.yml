version: 2

project_name: cf-dns-asg-sync

builds:
  - main: ./cmd/cf-dns-asg-sync
    binary: cf-dns-asg-sync
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - examples/*.yml

checksum:
  name_template: checksums.txt

release:
  mode: replace
  use_existing_draft: true
  replace_existing_artifacts: true
